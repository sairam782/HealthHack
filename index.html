<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaalinga</title>
<meta name="description" content="AI-powered multilingual hospital call bell triage">



<style>
:root {
  --bg: #fafafa; --surface: #ffffff; --surface-dim: #f4f4f5;
  --surface-raised: #ffffff; --fg: #09090b; --fg2: #52525b; --fg3: #a1a1aa;
  --border: #e4e4e7; --border-strong: #d4d4d8;
  --brand: #2563eb; --brand-hover: #1d4ed8; --brand-ghost: #eff6ff;
  --brand-glow: rgba(37,99,235,0.12);
  --red: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
  --red-glow: rgba(220,38,38,0.08);
  --teal: #0d9488; --teal-bg: #f0fdfa; --teal-border: #99f6e4;
  --violet: #7c3aed; --violet-bg: #f5f3ff; --violet-border: #ddd6fe;
  --sky: #0284c7; --sky-bg: #f0f9ff; --sky-border: #bae6fd;
  --green: #059669; --green-bg: #ecfdf5;
  --amber: #d97706; --amber-bg: #fffbeb;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  --r1: 6px; --r2: 10px; --r3: 14px; --r4: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0a0a0a; --surface-dim: #141414;
    --surface-raised: #1a1a1a; --fg: #fafafa; --fg2: #a1a1aa; --fg3: #52525b;
    --border: #27272a; --border-strong: #3f3f46;
    --brand: #60a5fa; --brand-hover: #3b82f6; --brand-ghost: #0c1929;
    --brand-glow: rgba(96,165,250,0.1);
    --red: #f87171; --red-bg: #1a0505; --red-border: #7f1d1d;
    --red-glow: rgba(248,113,113,0.06);
    --teal: #2dd4bf; --teal-bg: #041a17; --teal-border: #115e59;
    --violet: #a78bfa; --violet-bg: #0d0820; --violet-border: #4c1d95;
    --sky: #38bdf8; --sky-bg: #041525; --sky-border: #075985;
    --green: #34d399; --green-bg: #021a12;
    --amber: #fbbf24; --amber-bg: #1a1400;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0a0a0a; --surface-dim: #141414;
  --surface-raised: #1a1a1a; --fg: #fafafa; --fg2: #a1a1aa; --fg3: #52525b;
  --border: #27272a; --border-strong: #3f3f46;
  --brand: #60a5fa; --brand-hover: #3b82f6; --brand-ghost: #0c1929;
  --brand-glow: rgba(96,165,250,0.1);
  --red: #f87171; --red-bg: #1a0505; --red-border: #7f1d1d;
  --red-glow: rgba(248,113,113,0.06);
  --teal: #2dd4bf; --teal-bg: #041a17; --teal-border: #115e59;
  --violet: #a78bfa; --violet-bg: #0d0820; --violet-border: #4c1d95;
  --sky: #38bdf8; --sky-bg: #041525; --sky-border: #075985;
  --green: #34d399; --green-bg: #021a12;
  --amber: #fbbf24; --amber-bg: #1a1400;
  color-scheme: dark;
}
body { margin:0; background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
#root { min-height: 100vh; display: flex; flex-direction: column; }

/* ---- Animations ---- */
@keyframes fadeUp { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
@keyframes spin { to { transform:rotate(360deg) } }
@keyframes mic-pulse { 0% { box-shadow:0 0 0 0 rgba(220,38,38,0.4) } 70% { box-shadow:0 0 0 14px rgba(220,38,38,0) } 100% { box-shadow:0 0 0 0 rgba(220,38,38,0) } }
@keyframes slideIn { from { opacity:0; transform:translateX(20px) } to { opacity:1; transform:translateX(0) } }
@keyframes countUp { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
@keyframes wave { 0%,100% { height:4px } 50% { height:16px } }
@keyframes shimmer { 0% { background-position:-200% 0 } 100% { background-position:200% 0 } }
@keyframes urgentPulse { 0%,100% { border-color: var(--red-border) } 50% { border-color: var(--red) } }

/* ---- Topbar ---- */
.topbar { height:54px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; position:sticky; top:env(safe-area-inset-top,0px); z-index:100; }
.topbar-left { display:flex; align-items:center; gap:10px; }
.logo-mark { width:32px; height:32px; background:var(--red); border-radius:8px; display:grid; place-items:center; box-shadow:0 2px 8px var(--red-glow); flex-shrink:0; }
.logo-mark svg { width:18px; height:18px; }
.logo-text { font-weight:800; font-size:16px; letter-spacing:-0.04em; }
.badge { font-family:var(--mono); font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; letter-spacing:0.03em; }
.badge-brand { color:var(--brand); background:var(--brand-ghost); }
.topbar-right { display:flex; align-items:center; gap:6px; }

/* ---- Buttons ---- */
.btn { font-family:var(--font); font-size:12px; font-weight:600; padding:7px 14px; border-radius:var(--r1); cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--fg2); transition:all 0.15s; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.btn:hover { background:var(--surface-dim); border-color:var(--border-strong); }
.btn-primary { background:var(--brand); color:#fff; border-color:var(--brand); }
.btn-primary:hover { background:var(--brand-hover); }
.btn-primary:disabled { opacity:.35; cursor:not-allowed; }
.btn-warn { border-color:var(--amber); color:var(--amber); background:var(--amber-bg); }
.btn-sm { padding:5px 10px; font-size:11px; }

/* ---- Language Picker ---- */
.lang-picker { position:relative; }
.lang-btn { display:flex; align-items:center; gap:6px; padding:5px 10px; background:var(--surface-dim); border:1px solid var(--border); border-radius:var(--r1); cursor:pointer; font-size:12px; font-weight:600; color:var(--fg2); font-family:var(--font); transition:all 0.12s; }
.lang-btn:hover { border-color:var(--border-strong); }
.lang-btn .flag { font-size:16px; line-height:1; }
.lang-drop { position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--r2); box-shadow:0 12px 32px rgba(0,0,0,0.12); padding:6px; z-index:200; min-width:200px; animation:fadeUp 0.15s ease; }
.lang-opt { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--r1); cursor:pointer; font-size:13px; color:var(--fg2); border:none; background:none; width:100%; font-family:var(--font); transition:background 0.1s; }
.lang-opt:hover { background:var(--surface-dim); }
.lang-opt.active { background:var(--brand-ghost); color:var(--brand); font-weight:600; }
.lang-opt .flag { font-size:18px; }
.lang-opt .native { color:var(--fg3); font-size:11px; margin-left:auto; }

/* ---- Layout ---- */
.layout { flex:1; display:grid; grid-template-columns:1fr 1fr; }

/* ---- Patient Panel ---- */
.p-panel { display:flex; flex-direction:column; background:var(--surface); border-right:1px solid var(--border); }
.p-header { padding:28px 24px 20px; }
.p-header h1 { font-size:24px; font-weight:900; letter-spacing:-0.045em; margin:0 0 4px; line-height:1.15; text-wrap:balance; }
.p-header p { color:var(--fg2); font-size:13px; margin:0 0 14px; }
.room-chip { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; background:var(--surface-dim); border:1px solid var(--border); border-radius:var(--r1); font-size:12px; color:var(--fg2); }
.room-chip strong { font-family:var(--mono); font-weight:700; color:var(--fg); }
.room-dot { width:6px; height:6px; border-radius:50%; background:var(--green); }

/* ---- Quick Buttons ---- */
.quick-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:0 24px 16px; }
.qb { background:var(--surface); border:1px solid var(--border); border-radius:var(--r2); padding:14px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; font-family:var(--font); font-size:11px; font-weight:700; color:var(--fg2); cursor:pointer; transition:all 0.15s; text-align:center; letter-spacing:-0.01em; }
.qb:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-ghost); transform:translateY(-2px); box-shadow:0 4px 16px var(--brand-glow); }
.qb:active { transform:translateY(0); }
.qb-ico { font-size:22px; width:40px; height:40px; border-radius:var(--r2); display:grid; place-items:center; }

/* ---- Input ---- */
.input-area { padding:0 24px 24px; flex:1; display:flex; flex-direction:column; gap:10px; }
.input-label { font-size:11px; font-weight:700; color:var(--fg3); text-transform:uppercase; letter-spacing:0.05em; font-family:var(--mono); display:flex; align-items:center; justify-content:space-between; }
.ta-wrap { position:relative; flex:1; min-height:100px; }
.ta-wrap textarea { width:100%; height:100%; min-height:100px; background:var(--bg); border:1px solid var(--border); border-radius:var(--r2); padding:14px 50px 14px 14px; font-family:var(--font); font-size:14px; color:var(--fg); resize:none; line-height:1.55; transition:border-color 0.12s; }
.ta-wrap textarea::placeholder { color:var(--fg3); }
.ta-wrap textarea:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-glow); }
.mic-btn { position:absolute; right:10px; top:10px; width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:var(--surface); cursor:pointer; display:grid; place-items:center; transition:all 0.15s; color:var(--fg3); }
.mic-btn:hover { border-color:var(--brand); color:var(--brand); background:var(--brand-ghost); }
.mic-btn.recording { background:var(--red); border-color:var(--red); color:#fff; animation:mic-pulse 1.4s ease infinite; }
.mic-btn svg { width:16px; height:16px; }

/* ---- Voice Status ---- */
.voice-status { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--surface-dim); border-radius:var(--r1); font-size:12px; color:var(--fg2); animation:fadeIn 0.2s; }
.voice-dot { width:8px; height:8px; border-radius:50%; background:var(--red); animation:pulse 1s ease infinite; flex-shrink:0; }
.voice-lang { font-family:var(--mono); font-size:10px; color:var(--fg3); margin-left:auto; }

/* ---- TTS Bar ---- */
.tts-bar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--brand-ghost); border:1px solid var(--brand); border-radius:var(--r1); font-size:12px; color:var(--brand); font-weight:600; animation:fadeIn 0.2s; }
.tts-waves { display:flex; gap:2px; align-items:center; height:20px; }
.tts-wave { width:3px; background:var(--brand); border-radius:2px; }
.tts-wave:nth-child(1) { animation:wave 0.8s ease infinite 0s; }
.tts-wave:nth-child(2) { animation:wave 0.8s ease infinite 0.1s; }
.tts-wave:nth-child(3) { animation:wave 0.8s ease infinite 0.2s; }
.tts-wave:nth-child(4) { animation:wave 0.8s ease infinite 0.3s; }
.tts-wave:nth-child(5) { animation:wave 0.8s ease infinite 0.15s; }

/* ---- Processing Overlay ---- */
.processing { position:absolute; inset:0; background:var(--bg); border-radius:var(--r2); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; z-index:2; animation:fadeIn 0.15s; }
.spinner { width:28px; height:28px; border:2.5px solid var(--border); border-top-color:var(--brand); border-radius:50%; animation:spin 0.6s linear infinite; }
.spinner-text { font-size:12px; color:var(--fg3); }
.shimmer-bar { width:140px; height:4px; background:linear-gradient(90deg,var(--border) 25%,var(--brand-glow) 50%,var(--border) 75%); background-size:200% 100%; border-radius:2px; animation:shimmer 1.5s ease infinite; }

/* ---- Go Button ---- */
.go-row { display:flex; gap:8px; }
.go-btn { flex:1; background:var(--brand); color:#fff; border:none; border-radius:var(--r2); padding:13px 20px; font-family:var(--font); font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; transition:all 0.12s; letter-spacing:-0.01em; }
.go-btn:hover { background:var(--brand-hover); transform:translateY(-1px); box-shadow:0 4px 12px var(--brand-glow); }
.go-btn:active { transform:translateY(0); }
.go-btn:disabled { opacity:.35; cursor:not-allowed; transform:none; box-shadow:none; }

/* ---- Result Card ---- */
.rc { margin:0 24px 20px; padding:18px; border-radius:var(--r3); border-left:4px solid transparent; animation:fadeUp 0.3s ease; }
.rc-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.rc-tier { font-weight:800; font-size:14px; display:flex; align-items:center; gap:6px; }
.rc-p { font-family:var(--mono); font-size:10px; font-weight:800; padding:3px 8px; border-radius:4px; color:#fff; letter-spacing:0.02em; }
.rc-sum { font-size:13px; color:var(--fg2); line-height:1.55; margin-bottom:10px; }
.rc-translated { font-size:12px; color:var(--fg3); font-style:italic; margin-bottom:10px; padding:8px 10px; background:var(--surface-dim); border-radius:var(--r1); border-left:3px solid var(--brand); }
.rc-assign { font-size:12px; color:var(--fg3); margin-bottom:6px; }
.rc-assign strong { color:var(--fg2); }
.rc-reason { font-size:11px; color:var(--fg3); font-style:italic; margin-bottom:8px; }
.rc-conf { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.rc-conf-val { font-family:var(--mono); font-size:11px; font-weight:700; min-width:32px; text-align:right; }
.rc-bar-t { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
.rc-bar-f { height:100%; border-radius:2px; transition:width 0.6s cubic-bezier(0.22,1,0.36,1); }
.rc-status { font-size:12px; font-weight:800; display:flex; align-items:center; gap:5px; }
.rc-json-toggle { font-size:10px; color:var(--fg3); cursor:pointer; font-family:var(--mono); margin-top:8px; text-decoration:underline; text-underline-offset:2px; background:none; border:none; padding:0; }
.rc-json { margin-top:6px; padding:10px; background:var(--bg); border-radius:var(--r1); font-family:var(--mono); font-size:10px; line-height:1.5; color:var(--fg3); white-space:pre-wrap; word-break:break-word; max-height:150px; overflow-y:auto; animation:fadeIn 0.15s; }
.rc-secondary { margin-top:10px; padding:8px 10px; background:var(--surface-dim); border-radius:var(--r1); font-size:11px; color:var(--fg2); border-left:3px solid var(--fg3); }
.rc-lang-badge { font-family:var(--mono); font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; background:var(--surface-dim); color:var(--fg3); }

/* ---- Dashboard ---- */
.d-panel { display:flex; flex-direction:column; background:var(--bg); min-width:0; }
.kpi-row { display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface); border-bottom:1px solid var(--border); }
.kpi { text-align:center; padding:16px 4px; border-right:1px solid var(--border); }
.kpi:last-child { border-right:none; }
.kpi-val { font-size:24px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-0.04em; line-height:1; animation:countUp 0.3s ease; }
.kpi-lbl { font-size:9px; color:var(--fg3); margin-top:4px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; font-family:var(--mono); }

/* ---- Tier Tabs ---- */
.tier-tabs { display:flex; gap:4px; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; }
.tt { background:none; border:none; border-radius:var(--r1); padding:6px 12px; font-family:var(--font); font-size:11px; font-weight:700; color:var(--fg3); cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:5px; transition:all 0.12s; }
.tt:hover { background:var(--surface-dim); color:var(--fg2); }
.tt.on { background:var(--fg); color:var(--bg); }
.tt .c { font-family:var(--mono); font-size:10px; font-weight:700; opacity:0.6; }
.tt.on .c { opacity:1; }

/* ---- Feed ---- */
.feed { flex:1; overflow-y:auto; padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
.tk { background:var(--surface); border-radius:var(--r2); border:1px solid var(--border); display:flex; overflow:hidden; animation:slideIn 0.25s ease; transition:all 0.15s; }
.tk:hover { border-color:var(--border-strong); box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.tk.hot { border-color:var(--red-border); background:var(--red-bg); animation:slideIn 0.25s ease, urgentPulse 2s ease infinite; }
.tk-stripe { width:4px; flex-shrink:0; }
.tk-body { flex:1; padding:12px 14px; min-width:0; }
.tk-r1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.tk-room { font-weight:800; font-size:13px; font-family:var(--mono); }
.tk-time { font-family:var(--mono); font-size:10px; color:var(--fg3); }
.tk-msg { font-size:12px; color:var(--fg2); line-height:1.4; margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tk-tags { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.pill { font-size:9px; font-weight:800; padding:2px 7px; border-radius:4px; text-transform:uppercase; letter-spacing:0.04em; font-family:var(--mono); }
.pill-urg { background:var(--red-bg); color:var(--red); }
.pill-new { background:var(--brand-ghost); color:var(--brand); }
.tk-tier { font-size:10px; font-weight:700; }
.tk-who { font-size:10px; color:var(--fg3); margin-left:auto; }
.tk-lang { font-family:var(--mono); font-size:9px; color:var(--fg3); background:var(--surface-dim); padding:1px 5px; border-radius:3px; }

.empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--fg3); gap:10px; padding:40px 14px; }
.empty-state svg { opacity:0.1; }
.empty-state p { font-size:13px; }

/* ---- Toast ---- */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--fg); color:var(--bg); padding:10px 18px; border-radius:var(--r2); font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; z-index:200; transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 8px 24px rgba(0,0,0,0.2); max-width:90%; }
.toast.pop { transform:translateX(-50%) translateY(0); }

/* ---- Modal ---- */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); z-index:500; display:grid; place-items:center; animation:fadeIn 0.15s; }
.modal { background:var(--surface); border-radius:var(--r4); padding:24px; width:90%; max-width:420px; box-shadow:0 16px 48px rgba(0,0,0,0.2); animation:fadeUp 0.2s ease; max-height:90vh; overflow-y:auto; }
.modal h3 { font-size:17px; font-weight:800; margin:0 0 18px; letter-spacing:-0.03em; }
.modal-section { margin-bottom:18px; }
.modal-section-title { font-size:11px; font-weight:700; color:var(--fg3); text-transform:uppercase; letter-spacing:0.05em; font-family:var(--mono); margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.fl { display:block; font-size:10px; font-weight:700; color:var(--fg3); margin-bottom:5px; font-family:var(--mono); text-transform:uppercase; letter-spacing:0.06em; }
.fi { width:100%; padding:9px 12px; background:var(--bg); border:1px solid var(--border); border-radius:var(--r1); font-family:var(--mono); font-size:12px; color:var(--fg); margin-bottom:12px; transition:border-color 0.12s; }
.fi:focus { outline:none; border-color:var(--brand); }
select.fi { appearance:none; background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23a1a1aa' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-repeat:no-repeat; background-position:right 10px center; padding-right:28px; }
.modal-foot { display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }
.api-chip { font-size:11px; font-weight:700; padding:7px 10px; border-radius:var(--r1); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
.api-chip.ok { background:var(--green-bg); color:var(--green); }
.api-chip.no { background:var(--red-bg); color:var(--red); }
.api-chip .dot { width:6px; height:6px; border-radius:50%; }
.api-chip.ok .dot { background:var(--green); }
.api-chip.no .dot { background:var(--red); }

/* ---- Demo Banner ---- */
.demo-bar { background:var(--amber-bg); border-bottom:1px solid var(--amber); padding:7px 20px; font-size:12px; font-weight:700; color:var(--amber); text-align:center; animation:fadeIn 0.2s; }
.demo-bar code { font-family:var(--mono); font-size:11px; margin-left:8px; background:rgba(0,0,0,0.05); padding:1px 6px; border-radius:3px; }

/* ---- Responsive ---- */
@media (max-width:860px) {
  .layout { grid-template-columns:1fr; }
  .d-panel { display:flex; }
