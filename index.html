<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaalinga</title>
<meta name="description" content="Route a patient's hospital request to the right team and track the handoff.">
<meta name="theme-color" content="#0b4f6c">
<script src="/theme.js"></script>
<style>
/* Layout: the patient reads one centred column of large ordered actions; staff scan a command bar above a queue grid. */
:root {
  color-scheme: light;

  /* Neutrals — cool linen, biased toward the petrol accent */
  --paper: #e9eef1;
  --card: #ffffff;
  --card-2: #f3f7f8;
  --card-3: #dce7ec;
  --rule: #d8e2e7;
  --rule-strong: #b4c5cd;
  --ink: #142630;
  --ink-2: #466070;
  --ink-3: #6c8694;

  /* Accent — deep petrol, used for interactive surfaces only */
  --accent: #0b4f6c;
  --accent-2: #093c53;
  --accent-wash: #e2edf2;
  --accent-edge: #a9c8d6;
  --on-accent: #ffffff;

  /* Semantic state — kept separate from the accent hue */
  --critical: #b42318;
  --critical-wash: #fdecea;
  --critical-edge: #f2c2bd;
  --warn: #935007;
  --warn-wash: #fcf3e2;
  --warn-edge: #e7d2a4;
  --ok: #0c6b4e;
  --ok-wash: #e5f3ee;

  /* Care teams */
  --t-clinical: #b42318;
  --t-bedside: #0d7468;
  --t-services: #4c55a8;
  --t-specialist: #8a4379;

  --serif: "Iowan Old Style", "Hoefler Text", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --r1: 6px; --r2: 10px; --r3: 16px; --r4: 24px;
  --sh1: 0 1px 2px rgba(15,38,50,.06);
  --sh2: 0 2px 10px rgba(15,38,50,.07), 0 1px 2px rgba(15,38,50,.05);
  --sh3: 0 18px 44px rgba(12,32,44,.16);
  --focus: 0 0 0 3px rgba(11,79,108,.28);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0a1419;
    --card: #11212a;
    --card-2: #182d37;
    --card-3: #1f3744;
    --rule: #26404c;
    --rule-strong: #3e5b69;
    --ink: #e6eef1;
    --ink-2: #aec2cb;
    --ink-3: #87a0ad;
    --accent: #74c4e6;
    --accent-2: #a2dcf3;
    --accent-wash: #0f2f3d;
    --accent-edge: #2d5b70;
    --on-accent: #06232f;
    --critical: #ff9f94;
    --critical-wash: #35201e;
    --critical-edge: #7b413b;
    --warn: #efb457;
    --warn-wash: #2f2510;
    --warn-edge: #665122;
    --ok: #4fd1a5;
    --ok-wash: #0c2a22;
    --t-clinical: #ff9f94;
    --t-bedside: #4fd3c0;
    --t-services: #a4a9f2;
    --t-specialist: #e2a2cf;
    --sh1: 0 1px 2px rgba(0,0,0,.4);
    --sh2: 0 2px 10px rgba(0,0,0,.4);
    --sh3: 0 18px 44px rgba(0,0,0,.55);
    --focus: 0 0 0 3px rgba(116,196,230,.34);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0a1419;
  --card: #11212a;
  --card-2: #182d37;
  --card-3: #1f3744;
  --rule: #26404c;
  --rule-strong: #3e5b69;
  --ink: #e6eef1;
  --ink-2: #aec2cb;
  --ink-3: #87a0ad;
  --accent: #74c4e6;
  --accent-2: #a2dcf3;
  --accent-wash: #0f2f3d;
  --accent-edge: #2d5b70;
  --on-accent: #06232f;
  --critical: #ff9f94;
  --critical-wash: #35201e;
  --critical-edge: #7b413b;
  --warn: #efb457;
  --warn-wash: #2f2510;
  --warn-edge: #665122;
  --ok: #4fd1a5;
  --ok-wash: #0c2a22;
  --t-clinical: #ff9f94;
  --t-bedside: #4fd3c0;
  --t-services: #a4a9f2;
  --t-specialist: #e2a2cf;
  --sh1: 0 1px 2px rgba(0,0,0,.4);
  --sh2: 0 2px 10px rgba(0,0,0,.4);
  --sh3: 0 18px 44px rgba(0,0,0,.55);
  --focus: 0 0 0 3px rgba(116,196,230,.34);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
#root { min-height: 100vh; }
@supports (min-height: 100dvh) { #root { min-height: 100dvh; } }
.app { min-height: inherit; display: flex; flex-direction: column; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes halo {
  0% { box-shadow: 0 0 0 0 rgba(180,35,24,.34); }
  70% { box-shadow: 0 0 0 16px rgba(180,35,24,0); }
  100% { box-shadow: 0 0 0 0 rgba(180,35,24,0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ------------------------------------------------------------------ Primitives */
.eyebrow {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
}
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.btn {
  font: inherit; font-size: 13px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 8px 14px; border-radius: var(--r1);
  border: 1px solid var(--rule-strong); background: var(--card); color: var(--ink);
  cursor: pointer; white-space: nowrap;
  transition: background .14s, border-color .14s, color .14s, transform .14s;
}
.btn:hover:not(:disabled) { background: var(--card-2); border-color: var(--ink-3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); color: var(--on-accent); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-quiet:hover:not(:disabled) { background: var(--card-2); border-color: var(--rule); }
.btn-warn { border-color: var(--warn-edge); background: var(--warn-wash); color: var(--warn); }
.btn-warn:hover:not(:disabled) { border-color: var(--warn); background: var(--warn-wash); color: var(--warn); }
.btn-danger { border-color: var(--critical-edge); background: var(--critical-wash); color: var(--critical); }
.btn-danger:hover:not(:disabled) { border-color: var(--critical); background: var(--critical-wash); color: var(--critical); }
.btn-sm { min-height: 30px; padding: 5px 10px; font-size: 12px; }
.btn-block { width: 100%; min-height: 48px; font-size: 15px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--ink-2); }
.control {
  font: inherit; font-size: 15px; width: 100%;
  min-height: 46px; padding: 11px 12px;
  background: var(--card); color: var(--ink);
  border: 1px solid var(--rule-strong); border-radius: var(--r1);
  transition: border-color .14s, box-shadow .14s;
}
.control:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus); }
select.control { appearance: none; padding-right: 34px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 20px, calc(100% - 12px) 20px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
textarea.control { resize: vertical; line-height: 1.55; }
.hint { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .04em;
  padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule);
  background: var(--card-2); color: var(--ink-2); white-space: nowrap;
}
.pill-critical { background: var(--critical-wash); border-color: var(--critical-edge); color: var(--critical); }
.pill-warn { background: var(--warn-wash); border-color: var(--warn-edge); color: var(--warn); }
.pill-ok { background: var(--ok-wash); border-color: transparent; color: var(--ok); }
.pill-accent { background: var(--accent-wash); border-color: var(--accent-edge); color: var(--accent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.dot.off { background: var(--ink-3); animation: breathe 1.6s ease-in-out infinite; }

.note {
  border: 1px solid var(--rule); border-left: 3px solid var(--rule-strong);
  background: var(--card-2); border-radius: var(--r1);
  padding: 12px 14px; font-size: 13.5px; color: var(--ink-2); line-height: 1.55;
}
.note-warn { border-color: var(--warn-edge); border-left-color: var(--warn); background: var(--warn-wash); color: var(--warn); }
.alert {
  border: 1px solid var(--critical-edge); border-left: 3px solid var(--critical);
  background: var(--critical-wash); color: var(--critical);
  border-radius: var(--r1); padding: 12px 14px; font-size: 13.5px; line-height: 1.55;
  display: flex; flex-direction: column; gap: 10px; align-items: flex-start;
}
.spinner {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2.5px solid var(--rule); border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}

/* ------------------------------------------------------------------ Top bar */
.topbar {
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-right));
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  background: var(--card); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 34px; height: 34px; flex: none; border-radius: 9px;
  background: var(--accent); display: grid; place-items: center; box-shadow: var(--sh1);
}
.brand-name { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -.01em; line-height: 1; }
.brand-unit { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.bar-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.whoami { display: flex; flex-direction: column; align-items: flex-end; margin-right: 4px; min-width: 0; }
.whoami strong { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 22ch; }
.whoami span { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; background: var(--critical); color: #fff; font-family: var(--mono); font-size: 10.5px; font-weight: 700; }
:root[data-theme="dark"] .count, :root:not([data-theme="light"]) .count { color: #2a0f0c; }

/* ------------------------------------------------------------------ Status line */
.statusline {
  display: flex; align-items: center; gap: 8px 18px; flex-wrap: wrap;
  padding: 7px 16px; background: var(--card-3); border-bottom: 1px solid var(--rule);
  font-family: var(--mono); font-size: 11px; color: var(--ink-2); letter-spacing: .03em;
}
.statusline .conn { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.statusline .spacer { flex: 1; }

/* ------------------------------------------------------------------ Sheets (alerts / roster) */
.sheet {
  margin: 0 auto; width: min(100%, 1240px);
  padding: 18px 16px 0;
  animation: rise .18s ease both;
}
.sheet-inner {
  background: var(--card); border: 1px solid var(--rule); border-radius: var(--r3);
  box-shadow: var(--sh2); padding: 18px; max-height: 60vh; overflow: auto;
}
.sheet h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.sheet-sub { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; margin-bottom: 14px; }
.feed-item { padding: 11px 0; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.feed-item:first-of-type { border-top: 0; }
.feed-item.unread { color: var(--ink); font-weight: 500; }
.feed-item time { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 4px; }
.roster-group { margin-top: 16px; }
.roster-group > h3 { font-size: 11px; font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.roster-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 9px 0; border-top: 1px solid var(--rule); font-size: 13px;
}
.roster-row strong { font-size: 13.5px; }
.roster-row p { color: var(--ink-3); font-size: 12px; }
.roster-row small { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.roster-row label { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.roster-row input { width: 17px; height: 17px; accent-color: var(--accent); }

/* ------------------------------------------------------------------ Sign in */
.auth {
  flex: 1; display: grid; gap: 32px 48px; align-content: start;
  grid-template-columns: minmax(0, 1fr) minmax(0, 420px);
  grid-template-areas: "lede card" "steps card";
  width: min(100%, 1080px); margin: 0 auto;
  padding: clamp(28px, 6vw, 72px) 20px 48px;
}
.auth-lede { grid-area: lede; }
.auth-lede h1 {
  font-family: var(--serif); font-weight: 600;
  font-size: clamp(38px, 6.4vw, 60px); line-height: 1.02; letter-spacing: -.025em;
  margin: 14px 0 18px;
}
.auth-lede h1 em { font-style: italic; color: var(--accent); }
.auth-lede p { font-size: 17px; color: var(--ink-2); max-width: 36ch; line-height: 1.55; }
.auth-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
.auth-steps { grid-area: steps; display: grid; gap: 18px; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-top: 10px; border-top: 1px solid var(--rule); }
.step { min-width: 0; }
.step-n { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
.step strong { display: block; font-size: 14px; margin: 8px 0 3px; }
.step p { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.auth-card {
  grid-area: card;
  background: var(--card); border: 1px solid var(--rule); border-radius: var(--r4);
  box-shadow: var(--sh3); padding: clamp(22px, 3vw, 30px);
  display: flex; flex-direction: column; gap: 14px; align-self: start;
}
.auth-card h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.auth-card > p { font-size: 13.5px; color: var(--ink-2); }
.auth-selected { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.auth-help { border-top: 1px solid var(--rule); padding-top: 12px; font-size: 12.5px; color: var(--ink-3); }
.auth-help summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.auth-help p { margin-top: 8px; line-height: 1.55; }

/* ------------------------------------------------------------------ Patient */
.patient { width: min(100%, 720px); margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 18px; }
.p-greeting { display: flex; flex-direction: column; gap: 10px; }
.p-room { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
  font-family: var(--mono); font-size: 12px; letter-spacing: .06em; color: var(--ink-2);
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; }
.p-greeting h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 5.6vw, 40px); line-height: 1.08; letter-spacing: -.02em; }
.p-greeting > p { font-size: 16px; color: var(--ink-2); }
.p-lang { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.p-lang label { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.p-lang select { width: auto; min-width: 170px; min-height: 42px; font-size: 14px; }

.urgent {
  display: flex; align-items: center; gap: 14px; width: 100%;
  font: inherit; font-size: 17px; font-weight: 700; text-align: left;
  min-height: 72px; padding: 14px 20px; cursor: pointer;
  color: #fff; background: var(--critical); border: 1px solid var(--critical); border-radius: var(--r3);
  box-shadow: var(--sh2); transition: filter .14s, transform .14s;
}
.urgent:hover:not(:disabled) { filter: brightness(1.08); }
.urgent:active:not(:disabled) { transform: translateY(1px); }
.urgent:disabled { opacity: .7; cursor: progress; }
.urgent .urgent-ico { width: 40px; height: 40px; flex: none; border-radius: 10px; background: rgba(255,255,255,.17); display: grid; place-items: center; }
.urgent small { display: block; font-size: 12.5px; font-weight: 500; opacity: .88; margin-top: 2px; }
:root[data-theme="dark"] .urgent, :root:not([data-theme="light"]) .urgent { color: #2a0d0a; }

.live {
  background: var(--card); border: 1px solid var(--accent-edge); border-radius: var(--r3);
  box-shadow: var(--sh2); overflow: hidden; animation: rise .22s ease both;
}
.live-head { background: var(--accent-wash); padding: 11px 18px; border-bottom: 1px solid var(--accent-edge);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.live-head .eyebrow { color: var(--accent); }
.live-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.live-body > p { font-size: 17px; line-height: 1.45; color: var(--ink); }
.track { display: flex; align-items: center; gap: 0; }
.track-step { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.track-step:last-child { flex: none; }
.track-dot { width: 13px; height: 13px; flex: none; border-radius: 50%; border: 2px solid var(--rule-strong); background: var(--card); }
.track-step.on .track-dot { border-color: var(--accent); background: var(--accent); }
.track-step.on.done .track-dot { border-color: var(--ok); background: var(--ok); }
.track-label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.track-step.on .track-label { color: var(--ink); }
.track-line { flex: 1; height: 2px; min-width: 10px; background: var(--rule); margin: 0 8px; }
.track-step.on .track-line { background: var(--accent-edge); }
.audio-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  border-top: 1px solid var(--rule); padding-top: 12px; font-size: 13px; color: var(--ink-2); }
.audio-row span { flex: 1; min-width: 180px; }

.card {
  background: var(--card); border: 1px solid var(--rule); border-radius: var(--r3);
  box-shadow: var(--sh1); padding: 18px;
}
.card > h2 { font-size: 15px; font-weight: 700; }

.handsfree { display: flex; flex-direction: column; gap: 10px; }
.handsfree-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.handsfree-head strong { font-size: 15px; }
.handsfree-status { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink); }
.handsfree p { font-size: 13px; color: var(--ink-2); }
.handsfree small { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }

.quick { display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.qb {
  font: inherit; font-size: 13.5px; font-weight: 700; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
  min-height: 104px; padding: 14px 8px; cursor: pointer; text-align: center;
  background: var(--card); border: 1px solid var(--rule); border-radius: var(--r3);
  box-shadow: var(--sh1); transition: border-color .14s, transform .14s, box-shadow .14s;
}
.qb:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--sh2); }
.qb:active:not(:disabled) { transform: none; }
.qb:disabled { opacity: .5; cursor: not-allowed; }
.qb-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--card-2); }

.composer { display: flex; flex-direction: column; gap: 12px; }
.composer-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.composer-head .eyebrow { letter-spacing: .09em; }
.ta-wrap { position: relative; }
.ta-wrap textarea { min-height: 112px; padding-right: 62px; font-size: 16px; }
.mic {
  position: absolute; top: 9px; right: 9px; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; color: var(--ink-2);
  background: var(--card-2); border: 1px solid var(--rule-strong);
  transition: background .14s, color .14s, border-color .14s;
}
.mic:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.mic:disabled { opacity: .45; cursor: not-allowed; }
.mic.on { background: var(--critical); border-color: var(--critical); color: #fff; animation: halo 1.5s ease infinite; }
.listening { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--critical); }
.listening .dot { background: var(--critical); animation: breathe 1.1s ease-in-out infinite; }
.toggle-row { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.toggle-row input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

.history { display: flex; flex-direction: column; gap: 10px; }
.history > h2 { font-size: 15px; font-weight: 700; }
.req {
  display: grid; gap: 4px 12px; grid-template-columns: 1fr auto;
  padding: 14px 16px; background: var(--card); border: 1px solid var(--rule);
  border-left: 4px solid var(--rule-strong); border-radius: var(--r2); box-shadow: var(--sh1);
}
.req-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; grid-column: 1 / -1; }
.req-top strong { font-size: 13.5px; }
.req-text { grid-column: 1 / -1; font-size: 15px; line-height: 1.45; }
.req-status { grid-column: 1 / -1; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.req-foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

.demo { display: flex; flex-direction: column; gap: 10px; }
.demo-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--rule); font-size: 13px; }
.demo-row:first-of-type { border-top: 0; }
.demo-row .outcome { font-family: var(--mono); font-size: 11.5px; }
.demo-row.pass .outcome { color: var(--ok); }
.demo-row.fail .outcome { color: var(--warn); }

/* ------------------------------------------------------------------ Staff board */
.board { width: min(100%, 1240px); margin: 0 auto; padding: 22px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.board-head h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(24px, 3.4vw, 32px); letter-spacing: -.02em; line-height: 1.1; }
.board-head p { font-size: 14px; color: var(--ink-2); max-width: 62ch; margin-top: 5px; }

.stats { display: grid; gap: 1px; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r2); overflow: hidden; }
.stat { background: var(--card); padding: 12px 14px; min-width: 0; }
.stat-v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.stat-l { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabs { display: flex; gap: 7px; flex-wrap: wrap; }
.tab {
  font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  min-height: 34px; padding: 6px 13px; cursor: pointer;
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px;
  transition: border-color .14s, color .14s, background .14s;
}
.tab:hover { border-color: var(--rule-strong); }
.tab.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.queue { display: grid; gap: 12px; }
@media (min-width: 1080px) { .queue { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }

.ticket {
  position: relative; min-width: 0;
  background: var(--card); border: 1px solid var(--rule);
  border-left: 4px solid var(--rule-strong); border-radius: var(--r2);
  box-shadow: var(--sh1); padding: 15px 16px;
  display: flex; flex-direction: column; gap: 11px;
  animation: fade .2s ease both;
}
.ticket.hot { border-color: var(--critical-edge); box-shadow: 0 0 0 1px var(--critical-edge), var(--sh1); }
.ticket.closed { opacity: .62; }
.tk-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tk-room { font-family: var(--mono); font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.tk-age { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11.5px; color: var(--ink-3); }
.tk-text { font-size: 15.5px; line-height: 1.45; }
.tk-summary { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.tk-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tk-team { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.tk-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 11px; }
.tk-trace { flex: 1; min-width: 150px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); line-height: 1.5; }
.tk-refer { border-top: 1px solid var(--rule); padding-top: 10px; font-size: 13px; }
.tk-refer summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.tk-refer form { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.tk-refer textarea { min-height: 72px; font-size: 14px; }

.impact { font-size: 13.5px; color: var(--ink-2); }
.impact summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.impact p { margin-top: 10px; line-height: 1.6; }
.impact input { width: 72px; min-height: 34px; padding: 6px 8px; margin: 0 6px; font-family: var(--mono);
  background: var(--card); color: var(--ink); border: 1px solid var(--rule-strong); border-radius: var(--r1); }

.blank { display: grid; place-items: center; gap: 12px; padding: 48px 20px; text-align: center; color: var(--ink-2); }

/* ------------------------------------------------------------------ Video call */
.call {
  width: min(100%, 1240px); margin: 18px auto 0; padding: 0 16px;
}
.call-inner { background: var(--card); border: 1px solid var(--accent-edge); border-radius: var(--r3);
  box-shadow: var(--sh3); padding: 18px; display: flex; flex-direction: column; gap: 13px; }
.call-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.call-head h2 { font-family: var(--serif); font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
.call-privacy { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.call-videos { display: grid; gap: 10px; grid-template-columns: 2fr 1fr; align-items: start; }
.call-tile { position: relative; background: #07131a; border: 1px solid var(--rule); border-radius: var(--r2);
  aspect-ratio: 16 / 10; max-width: 100%; overflow: hidden; display: grid; place-items: center; }
.call-tile video { width: 100%; height: 100%; object-fit: cover; display: block; background: #07131a; }
.call-caption { position: absolute; left: 8px; bottom: 8px; font-family: var(--mono); font-size: 10.5px;
  letter-spacing: .05em; text-transform: uppercase; color: #fff; background: rgba(4,14,20,.66);
  padding: 3px 7px; border-radius: 4px; }
.call-placeholder { font-size: 13px; color: #9fb6c1; padding: 16px; text-align: center; }
.call-controls { display: flex; gap: 8px; flex-wrap: wrap; }

/* ------------------------------------------------------------------ Toast + footer */
.toast {
  position: fixed; z-index: 90; left: 50%; transform: translateX(-50%) translateY(140%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 32px), 460px);
  background: var(--ink); color: var(--paper);
  border-radius: var(--r2); box-shadow: var(--sh3);
  padding: 13px 16px; font-size: 13.5px; line-height: 1.45;
  transition: transform .26s cubic-bezier(.2,.8,.3,1), opacity .2s; opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.footer { margin-top: auto; padding: 22px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--rule); text-align: center; font-size: 12px; color: var(--ink-3); line-height: 1.6; }

/* ------------------------------------------------------------------ Narrow */
@media (max-width: 900px) {
  .auth { grid-template-columns: minmax(0, 1fr); grid-template-areas: "card" "lede" "steps";
    width: min(100%, 560px); gap: 28px; padding-top: 24px; }
  .auth-steps { grid-template-columns: 1fr; gap: 14px; }
  .call-videos { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats .stat:first-child { grid-column: 1 / -1; }
  .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .qb { min-height: 112px; font-size: 14.5px; }
  .whoami { display: none; }
  .statusline .model { display: none; }
  .board-head { align-items: flex-start; }
  .tk-actions .btn { flex: 1; }
}
@media (max-width: 420px) {
  .topbar { padding-left: 12px; padding-right: 12px; }
  .brand-unit { display: none; }
}
</style>
